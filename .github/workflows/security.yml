name: Security Reusable Workflow

on:
  workflow_call:
    inputs:
      include-dependency-review:
        description: "Include dependency review"
        required: false
        type: boolean
        default: true

# Least-privilege token scope, derived from the steps below (Issue #398):
#   * checks: write        — rustsec/audit-check annotates the check run.
#   * pull-requests: write — dependency-review posts its `comment-summary-in-pr`
#                            summary comment.
# `issues: write` is deliberately NOT granted: audit-check only files issues on
# non-PR events (push/schedule) and this workflow's sole caller is PR-gated, so
# the scope would be dead weight widening the blast radius. A schedule-triggered
# caller that wants issue filing can grant `issues: write` itself.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          # No step in this job pushes back or fetches a private submodule, so
          # the GITHUB_TOKEN need not be written to .git/config (Issue #388).
          persist-credentials: false

      # NEAT-AI-core checkout + sibling symlink (Issue #18) via the shared
      # composite action (Issue #401); the composite sets persist-credentials:
      # false, so this read-only job keeps the token off disk (Issue #388).
      - name: Set up NEAT-AI-core sibling (path dependency for neat-core)
        uses: ./.github/actions/setup-neat-core

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      # Official RustSec GitHub Action — wraps cargo-audit and annotates the PR /
      # check run with any RUSTSEC advisories found in Cargo.lock.
      - name: Cargo Security Audit (rustsec/audit-check)
        # Master HEAD post upstream #48 (commit 858dc40, 2026-03-20) — action.yml
        # declares `using: node24`. The v2.0.0 tag (2024-09-23) still pins
        # node20, and no v2.1 / v3 tag has shipped yet, so we SHA-pin to the
        # master commit. Issue #136 cleared the prior Node 20 exception.
        uses: rustsec/audit-check@858dc40f52ca2b8570b7a997c1c4e35c6fc9a432  # v2 (master HEAD, Node 24, post upstream #48)
        # This action compiles cargo-audit from source with `cargo install`.
        # `rust-toolchain.toml` pins the repo to a concrete rustc for
        # reproducible builds of *our* code, but that pin must not gate the
        # build of a third-party *tool*: a transitive cargo-audit dep can raise
        # its MSRV above our pin and break this step with no code change (e.g.
        # kstring@2.0.4 requires rustc 1.96.0, our pin is older — PR #361).
        # RUSTUP_TOOLCHAIN overrides rust-toolchain.toml (highest rustup
        # precedence) so cargo-audit builds under the installed `stable`
        # toolchain, decoupling the tool's build from our code's MSRV pin.
        env:
          RUSTUP_TOOLCHAIN: stable
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # A second, direct `cargo audit` run used to follow the action here as
      # "belt-and-braces". It was pure duplication (Issue #399): `rustsec/audit-check`
      # already fails the check on any advisory, so a follow-up run against the
      # identical `Cargo.lock` in the same job cannot catch anything the action
      # missed. The standalone `cargo-audit.yml` still runs a prebuilt
      # `cargo audit` on every PR (and on its weekly cron) for branches that
      # bypass this reusable workflow, so no coverage is lost.

      # Optional dependency review, gated behind the `include-dependency-review`
      # input so a caller can opt out. The sole caller (`ci.yml`) now passes
      # `false` (Issue #399): the standalone `dependency-review.yml` is the
      # single universal dependency-review gate on every PR — running it here
      # too only duplicated the verdict on the Develop / milestone path. The
      # capability (and the `pull-requests: write` scope it needs to post its
      # comment summary) is retained for any future caller that opts back in.
      - name: Dependency review
        if: ${{ inputs.include-dependency-review && github.event_name == 'pull_request' }}
        # Bumped to v5.0.0 in Issue #136 — upstream shipped Node 24 on
        # 2026-05-08, clearing the prior tracked Node 20 exception.
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          comment-summary-in-pr: always
