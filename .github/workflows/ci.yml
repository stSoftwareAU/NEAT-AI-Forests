# Quality bar aligned with NEAT-AI-scorer (fmt, clippy, tests, security, spell & shell checks).
#
# Job dependency graph:
#
#   validation ──┬── quality ─────────────┐
#                │                         │
#                └── security ─────────────┤
#                                          ├──► ci-required  (aggregator)
#   shell-checks ──────────────────────────┤
#   spell-check ───────────────────────────┤
#   version-increment ─────────────────────┘
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone branches carry the same required checks as Develop, so PRs
      # from issue branches into a milestone must run CI too (Issue #89).
      - "milestone/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"

jobs:
  quality:
    name: Quality Checks
    needs: [validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-D warnings"

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18
        with:
          components: rustfmt, clippy

      - name: Cache dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2.81.10
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run linter
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features -- \
            -D warnings \
            -D clippy::filter_next \
            -D clippy::collapsible_if

      - name: Build workspace
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace --all-features --verbose -- --test-threads=2

      - name: Build documentation
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

  security:
    needs: [validation]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    with:
      include-dependency-review: false

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Check for required files
        run: |
          set -euo pipefail
          required_files=(
            "Cargo.toml"
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CHANGELOG.md"
            "quality.sh"
            "deny.toml"
            "rust-toolchain.toml"
            "forests/src/main.rs"
            ".github/CODEOWNERS"
            "SECURITY.md"
            "neat-core.expected-version"
            "scripts/runlib.sh"
            "scripts/family-pins.sh"
            "scripts/hold-core-pin.sh"
            "scripts/sync-core-helpers.sh"
          )
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              missing_files+=("$file")
            fi
          done
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "Missing required files: ${missing_files[*]}"
            exit 1
          fi

      - name: Validate Cargo workspace
        run: cargo metadata --no-deps --format-version 1 > /dev/null

      - name: Gate on unhandled breaking neat-core bump
        run: ./scripts/check-neat-core-version.sh

  version-increment:
    name: Auto-increment Version
    # The unattended machines rebuild only when the crate version changes, so a
    # PR that lands code at an unchanged version ships nothing. Bump it here
    # when the author has not (Issue #45).
    #
    # Three things happen here, in one job and one commit (Issue #105):
    #   1. Both copied NEAT-AI-core helpers — `scripts/runlib.sh` and
    #      `scripts/family-pins.sh` — are refreshed from core `Develop`.
    #   2. `scripts/family-pins.sh` moves the `neat-core` and `neat-ai-rebase`
    #      release-tag pins in `forests/Cargo.toml` to each repository's newest
    #      release and re-locks `Cargo.lock`.
    #   3. The crate version is bumped. A moved pin changes what the binary is
    #      built from, so it must not land at an unchanged version — carrying
    #      all three in one commit is what guarantees that.
    #
    # Fork PRs are skipped: this workflow cannot push to a fork's branch, and a
    # skipped job counts as OK in `ci-required`. The bump then rides the
    # maintainer's own follow-up branch.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # The push token is never persisted into .git/config, where any later
          # build script could read it; it is supplied per step instead.
          persist-credentials: false

      # `scripts/family-pins.sh` runs `cargo update`, so the toolchain is needed
      # here too. Same pin as the other jobs in this workflow.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable, frozen 2026-05-18

      - name: Refresh the copied NEAT-AI-core helpers
        # scripts/runlib.sh (core#680) and scripts/family-pins.sh (core#681) are
        # NEAT-AI-core's files; this repository only carries byte-identical
        # copies. Refreshing them here folds a stale copy into the same commit
        # the bump below pushes. A fetch that fails fails the job rather than
        # shipping a copy nobody checked (Issues #104, #105).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/sync-core-helpers.sh

      # The only way the family pins move: through this repository's own PR. An
      # unresolvable remote or an unrewritable pin exits non-zero rather than
      # leaving a pin quietly stale (Issue #105).
      #
      # This step runs the file the step above just fetched from NEAT-AI-core
      # `Develop` — the same trust boundary every fleet host already crosses by
      # executing its copy of `runlib.sh`, and the same one NEAT-AI-Rebase's own
      # version-increment job crosses. Nothing here widens it: the checkout does
      # not persist credentials, the push token is supplied only to the commit
      # step below, and the job's write scope is this PR branch.
      - name: Move the family pins to the latest releases
        run: ./scripts/family-pins.sh

      # `family-pins.sh` moves each pin on its own and cannot see that
      # `neat-ai-rebase` carries a `neat-core` pin of its own, so a core
      # release ahead of Rebase's pin locks two `neat-core` copies and reds
      # `validation`. This holds the core pin at the release Rebase carries
      # until Rebase cuts a release on the newer core; a divergence it cannot
      # hold exits non-zero rather than pushing a lockfile that will red
      # (PR #111).
      - name: Hold the neat-core pin at the release neat-ai-rebase carries
        run: ./scripts/hold-core-pin.sh

      - name: Bump the crate version when this PR has not already
        env:
          BASE_REF: ${{ github.base_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${PUSH_TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --no-tags "$remote" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git show "origin/${BASE_REF}:forests/Cargo.toml" > "${RUNNER_TEMP}/base-Cargo.toml"
          base="$(./scripts/auto-version.sh --print "${RUNNER_TEMP}/base-Cargo.toml")"
          ./scripts/auto-version.sh forests/Cargo.toml "$base" Cargo.lock

      - name: Commit and push the sync, the pins and the bump
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          SYNCED_PATHS=(
            forests/Cargo.toml
            Cargo.lock
            scripts/runlib.sh
            scripts/family-pins.sh
          )
          if git diff --quiet -- "${SYNCED_PATHS[@]}"; then
            echo "Version is already ahead of ${BASE_REF}, the family pins are on" \
              "the latest releases and the copied helpers match NEAT-AI-core —" \
              "nothing to commit"
            exit 0
          fi
          # One commit carries all three, and names only the parts that
          # changed. Each part is decided by the lines it actually touched: a
          # moved pin also dirties forests/Cargo.toml, so asking "did this file
          # change?" would title a pure pin move as a version bump.
          parts=()
          if git diff -U0 -- forests/Cargo.toml | grep -q '^+version = '; then
            version="$(./scripts/auto-version.sh --print forests/Cargo.toml)"
            parts+=("auto-increment crate version to ${version}")
          fi
          if git diff -U0 -- forests/Cargo.toml | grep -q '^+.*tag = "v'; then
            parts+=("move the family pins to the latest releases")
          fi
          if ! git diff --quiet -- scripts/runlib.sh scripts/family-pins.sh; then
            parts+=("refresh the NEAT-AI-core helpers")
          fi
          if [ ${#parts[@]} -eq 0 ]; then
            # Cargo.lock alone moved — a re-lock with no manifest change.
            parts+=("re-lock Cargo.lock")
          fi
          message="chore:"
          separator=" "
          for part in "${parts[@]}"; do
            message="${message}${separator}${part}"
            separator=", "
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- "${SYNCED_PATHS[@]}"
          git commit -m "${message}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:${HEAD_REF}"

  shell-checks:
    name: Shell Script Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Check bash script syntax
        run: |
          set -euo pipefail
          EXIT_CODE=0
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "OK $script"
            else
              echo "FAIL $script"
              EXIT_CODE=1
            fi
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          exit $EXIT_CODE

      - name: Run ShellCheck
        env:
          SHELLCHECK_OPTS: -s bash
        run: |
          set -euo pipefail
          shellcheck --version
          scripts=()
          while IFS= read -r script; do
            scripts+=("$script")
          done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "No shell scripts found — nothing to lint"
            exit 0
          fi
          shellcheck --severity=warning "${scripts[@]}"

      - name: Check scripts/runlib.sh already-installed contract
        run: ./scripts/test-runlib.sh

      - name: Check the NEAT-AI-core helper refresh contract
        run: ./scripts/test-sync-core-helpers.sh

      - name: Check the neat-core release-pin gate
        run: ./scripts/test-check-neat-core-version.sh

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          persist-credentials: false

      - name: Install codespell
        run: pip install --user codespell

      - name: Run codespell preflight
        run: ./scripts/spell-check.sh

  ci-required:
    name: CI Required Checks
    needs:
      [validation, quality, security, shell-checks, spell-check, version-increment]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all gating jobs succeeded
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          SHELL_CHECKS_RESULT: ${{ needs.shell-checks.result }}
          SPELL_CHECK_RESULT: ${{ needs.spell-check.result }}
          VERSION_INCREMENT_RESULT: ${{ needs.version-increment.result }}
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" result="$2"
            if [[ "$result" == "success" || "$result" == "skipped" ]]; then
              echo "OK   $name: $result"
            else
              echo "FAIL $name: $result" >&2
              fail=1
            fi
          }
          check "validation"   "$VALIDATION_RESULT"
          check "quality"      "$QUALITY_RESULT"
          check "security"     "$SECURITY_RESULT"
          check "shell-checks" "$SHELL_CHECKS_RESULT"
          check "spell-check"  "$SPELL_CHECK_RESULT"
          check "version-increment" "$VERSION_INCREMENT_RESULT"
          if [[ "$fail" -ne 0 ]]; then
            echo "One or more gating jobs did not succeed — blocking merge." >&2
            exit 1
          fi
          echo "All gating jobs succeeded — safe to merge."
