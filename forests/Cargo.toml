[package]
name = "neat_ai_forests"
version = "0.1.22"
edition = "2024"
license = "Apache-2.0"
description = "Experimental residual decision-tree optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Forests"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "neat_ai_forests"
path = "src/lib.rs"

[[bin]]
name = "neat_ai_forests"
path = "src/main.rs"

[dependencies]
# Keep this sibling path aligned with NEAT-AI-scorer / NEAT-AI-Lamarck. CI
# checks out NEAT-AI-core beside this repo (see .github/actions/setup-neat-core).
neat-core = { path = "../../NEAT-AI-core/neat-core" }
# Producer side of population re-entry: `PatchLog` files each accepted patch as
# a v1 enhancement so Rebase can graft it onto a freshly fetched champion
# (stSoftwareAU/NEAT-AI-Rebase#65). Sibling path, like `neat-core`; CI checks
# the repository out beside this one (see `.github/actions/setup-neat-ai-rebase`).
neat-ai-rebase = { path = "../../NEAT-AI-Rebase/rebase" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"

# Graceful SIGINT/SIGTERM cancellation. Unix-only crate; the handler is
# installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
