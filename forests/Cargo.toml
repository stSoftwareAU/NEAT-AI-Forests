[package]
name = "neat_ai_forests"
version = "0.1.29"
edition = "2024"
license = "Apache-2.0"
description = "Experimental residual decision-tree optimiser for already-fit NEAT-AI creatures."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Forests"
readme = "../README.md"

[lints]
workspace = true

[lib]
name = "neat_ai_forests"
path = "src/lib.rs"

# No explicit `[[bin]]` table: cargo's own default — `src/main.rs`, named after
# the package — is exactly what this crate wants, and the canonical
# `scripts/runlib.sh` skip path declines to read any manifest carrying one,
# falling back to `cargo metadata` on every fleet run (NEAT-AI-core#680).

[dependencies]
# Both family dependencies are pinned to a *release tag*, not a sibling
# checkout (Issue #105): the workspace builds anywhere, and a pin moves only
# through this repository's own PR — `scripts/family-pins.sh`, run by the
# `version-increment` job, rewrites the tags below to each repository's newest
# release and re-locks `Cargo.lock` in the same commit as the version bump.
#
# The two pins must agree on `neat-core`. Cargo happily locks two git sources
# at different tags — the build then dies in rustc as a type mismatch — so
# `scripts/check-neat-core-version.sh` reds the `validation` job the moment
# `Cargo.lock` carries more than one `neat-core`. When NEAT-AI-Rebase's own
# `neat-core` pin at the tag below lags behind the core tag here, Forests stays
# on the older pair until Rebase's own pin PR lands and it cuts a new release.
neat-core = { git = "https://github.com/stSoftwareAU/NEAT-AI-core", tag = "v0.22.7" }
# Producer side of population re-entry: `PatchLog` files each accepted patch as
# a v1 enhancement so Rebase can graft it onto a freshly fetched champion
# (stSoftwareAU/NEAT-AI-Rebase#65).
neat-ai-rebase = { git = "https://github.com/stSoftwareAU/NEAT-AI-Rebase", tag = "v0.1.2" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
sha2 = "0.10"

# Graceful SIGINT/SIGTERM cancellation. Unix-only crate; the handler is
# installed behind `cfg(unix)`.
[target.'cfg(unix)'.dependencies]
signal-hook = { version = "0.4", default-features = false }

[dev-dependencies]
tempfile = "3"
